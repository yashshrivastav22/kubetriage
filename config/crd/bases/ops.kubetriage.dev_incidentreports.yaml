---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: incidentreports.ops.kubetriage.dev
spec:
  group: ops.kubetriage.dev
  names:
    kind: IncidentReport
    listKind: IncidentReportList
    plural: incidentreports
    singular: incidentreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.incidentType
      name: Type
      type: string
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IncidentReport is the Schema for the incidentreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the stable identity of the incident.
            properties:
              containerName:
                description: ContainerName is the affected container.
                minLength: 1
                type: string
              fingerprint:
                description: |-
                  Fingerprint is the stable identity used by KubeTriage to avoid creating
                  duplicate reports for the same incident.

                  It will be derived from the policy, Pod, container, and incident type.
                minLength: 1
                type: string
              incidentType:
                description: IncidentType identifies the Kubernetes failure detected.
                enum:
                - CrashLoopBackOff
                - OOMKilled
                - ErrImagePull
                - ImagePullBackOff
                type: string
              podName:
                description: PodName is the affected Pod.
                minLength: 1
                type: string
              podUID:
                description: PodUID uniquely identifies the affected Pod instance.
                minLength: 1
                type: string
              policyName:
                description: PolicyName is the IncidentPolicy that detected this incident.
                minLength: 1
                type: string
              policyUID:
                description: PolicyUID uniquely identifies the IncidentPolicy instance.
                minLength: 1
                type: string
            required:
            - containerName
            - fingerprint
            - incidentType
            - podName
            - podUID
            - policyName
            - policyUID
            type: object
          status:
            description: status defines the observed lifecycle and evidence for the
              incident.
            properties:
              conditions:
                description: Conditions represent additional lifecycle state for this
                  report.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidence:
                description: |-
                  Evidence contains bounded Kubernetes evidence associated with
                  the most recent observation.
                properties:
                  currentState:
                    description: |-
                      CurrentState describes the current container state when the incident
                      was last evaluated.
                    type: string
                  exitCode:
                    description: ExitCode contains the previous container exit code
                      when available.
                    format: int32
                    type: integer
                  lastTerminationReason:
                    description: |-
                      LastTerminationReason contains the previous container termination reason
                      when available.
                      Example: OOMKilled.
                    type: string
                  restartCount:
                    description: RestartCount is the restart count reported for the
                      affected container.
                    format: int32
                    type: integer
                  waitingReason:
                    description: |-
                      WaitingReason contains the Kubernetes waiting reason when applicable.
                      Examples include CrashLoopBackOff and ImagePullBackOff.
                    type: string
                type: object
              firstDetectedAt:
                description: FirstDetectedAt is when KubeTriage first observed this
                  incident.
                format: date-time
                type: string
              lastObservedAt:
                description: |-
                  LastObservedAt is the most recent time KubeTriage observed the
                  incident condition.
                format: date-time
                type: string
              phase:
                description: Phase describes the current incident lifecycle state.
                enum:
                - Active
                - Resolved
                type: string
              resolvedAt:
                description: ResolvedAt is populated when the incident is no longer
                  observed.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
