---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: incidentreports.ops.kubetriage.dev
spec:
  group: ops.kubetriage.dev
  names:
    kind: IncidentReport
    listKind: IncidentReportList
    plural: incidentreports
    singular: incidentreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.incidentType
      name: Type
      type: string
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: IncidentReport is the Schema for the incidentreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the stable identity of the incident.
            properties:
              containerName:
                description: ContainerName is the affected container.
                minLength: 1
                type: string
              fingerprint:
                description: |-
                  Fingerprint is the stable identity used to prevent duplicate reports.

                  Derived from:
                  Policy UID
                  Pod UID
                  Container name
                  Incident type
                minLength: 1
                type: string
              incidentType:
                description: IncidentType identifies the Kubernetes failure detected.
                enum:
                - CrashLoopBackOff
                - OOMKilled
                - ErrImagePull
                - ImagePullBackOff
                type: string
              podName:
                description: PodName is the affected Pod.
                minLength: 1
                type: string
              podUID:
                description: PodUID uniquely identifies the affected Pod instance.
                minLength: 1
                type: string
              policyName:
                description: PolicyName is the IncidentPolicy that detected this incident.
                minLength: 1
                type: string
              policyUID:
                description: PolicyUID uniquely identifies the IncidentPolicy instance.
                minLength: 1
                type: string
            required:
            - containerName
            - fingerprint
            - incidentType
            - podName
            - podUID
            - policyName
            - policyUID
            type: object
          status:
            description: status defines lifecycle and evidence.
            properties:
              conditions:
                description: Conditions represent additional lifecycle state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidence:
                description: |-
                  Evidence contains bounded Kubernetes evidence associated with the
                  incident.
                properties:
                  configuredImage:
                    description: |-
                      ConfiguredImage is the image declared in the Pod specification.

                      Example:
                      checkout:v2.4.1
                    type: string
                  containerID:
                    description: |-
                      ContainerID identifies the running or terminated container instance.

                      Example:
                      containerd://abc123
                    type: string
                  currentState:
                    description: |-
                      CurrentState describes the current container state.

                      Expected values include:
                      Waiting
                      Running
                      Terminated
                      Unknown
                    type: string
                  events:
                    description: |-
                      Events contains a bounded set of Kubernetes Events related to the
                      affected Pod.
                    items:
                      description: |-
                        IncidentEventEvidence represents bounded Kubernetes Event evidence collected
                        for the Pod involved in an incident.
                      properties:
                        action:
                          description: Action describes the action reported by the
                            Event producer.
                          type: string
                        count:
                          description: Count represents how many times this Event
                            occurred.
                          format: int32
                          type: integer
                        firstObservedAt:
                          description: FirstObservedAt represents when the Event was
                            first observed.
                          format: date-time
                          type: string
                        lastObservedAt:
                          description: LastObservedAt represents the most recent observation
                            of the Event.
                          format: date-time
                          type: string
                        note:
                          description: |-
                            Note contains the human-readable Event description.

                            KubeTriage bounds this field before storing it.
                          maxLength: 1024
                          type: string
                        reason:
                          description: Reason is the machine-readable Kubernetes Event
                            reason.
                          type: string
                        reportingController:
                          description: ReportingController identifies the component
                            that reported the Event.
                          type: string
                        type:
                          description: Type is normally Normal or Warning.
                          type: string
                      type: object
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: atomic
                  exitCode:
                    description: ExitCode contains the container termination exit
                      code when available.
                    format: int32
                    type: integer
                  imageID:
                    description: ImageID identifies the exact image reported by the
                      container runtime.
                    type: string
                  lastTerminationReason:
                    description: |-
                      LastTerminationReason contains the termination reason when available.

                      Example:
                      OOMKilled
                    type: string
                  nodeName:
                    description: NodeName is the Kubernetes node assigned to the affected
                      Pod.
                    type: string
                  restartCount:
                    description: RestartCount is the restart count reported for the
                      affected container.
                    format: int32
                    type: integer
                  runtimeImage:
                    description: |-
                      RuntimeImage is the image name reported by ContainerStatus.

                      This can differ from the value originally declared in the Pod spec.
                    type: string
                  signal:
                    description: |-
                      Signal contains the signal associated with container termination when
                      Kubernetes reports one.
                    format: int32
                    type: integer
                  terminationFinishedAt:
                    description: TerminationFinishedAt is when the container terminated.
                    format: date-time
                    type: string
                  terminationMessage:
                    description: |-
                      TerminationMessage contains bounded termination information reported by
                      Kubernetes.
                    maxLength: 1024
                    type: string
                  terminationStartedAt:
                    description: TerminationStartedAt is when the terminated container
                      execution began.
                    format: date-time
                    type: string
                  waitingReason:
                    description: |-
                      WaitingReason contains the Kubernetes waiting reason when applicable.

                      Examples:
                      CrashLoopBackOff
                      ErrImagePull
                      ImagePullBackOff
                    type: string
                type: object
              firstDetectedAt:
                description: FirstDetectedAt is when KubeTriage first observed this
                  incident.
                format: date-time
                type: string
              lastObservedAt:
                description: LastObservedAt is the most recent time KubeTriage observed
                  the incident.
                format: date-time
                type: string
              phase:
                description: Phase describes the current incident lifecycle state.
                enum:
                - Active
                - Resolved
                type: string
              resolvedAt:
                description: ResolvedAt is populated when the incident is no longer
                  observed.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
