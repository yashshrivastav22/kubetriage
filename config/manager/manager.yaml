apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kubetriage
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kubetriage
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: kubetriage

  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: kubetriage

    spec:
      serviceAccountName: controller-manager

      # KubeTriage requires its service account token to communicate with the
      # Kubernetes API, so automount is intentionally left enabled.

      # Avoid injecting unnecessary Kubernetes Service environment variables
      # into the manager container.
      enableServiceLinks: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: manager

          image: controller:latest

          imagePullPolicy: IfNotPresent

          command:
            - /manager

          args:
            # Only one controller-manager instance may actively reconcile,
            # including during rolling updates.
            - --leader-elect

            # Health/readiness server.
            - --health-probe-bind-address=:8081

            # Enable the custom Prometheus metrics implemented in Phase 6.2.
            - --metrics-secure=true

            # KubeTriage V1 has no admission/conversion webhook.
            # Do not expose an unnecessary listener.
            - --webhook-port=-1

          ports:
            - containerPort: 8081
              name: health
              protocol: TCP

            - containerPort: 8443
              name: metrics
              protocol: TCP

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi

          volumeMounts: []

      volumes: []

      # main.go gives controller-runtime 20 seconds for graceful shutdown.
      # Kubernetes provides 30 seconds before forcing container termination.
      terminationGracePeriodSeconds: 30
