apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: kubetriage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-demo
  template:
    metadata:
      labels:
        app: crashloop-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "KubeTriage CrashLoop E2E demo starting"
              echo "Application initialization failed"
              sleep 2
              exit 1
