apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagepull-demo
  namespace: kubetriage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: imagepull-demo
  template:
    metadata:
      labels:
        app: imagepull-demo
    spec:
      containers:
        - name: app
          image: registry.invalid/kubetriage/this-image-does-not-exist:v999
          command:
            - /bin/sh
            - -c
          args:
            - sleep 3600
